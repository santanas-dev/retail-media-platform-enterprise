# Admin Web — static serve + SPA fallback + healthcheck.
# PILOT-DEPLOYMENT-READINESS-001B (SCOPE B).
#
# This container serves ONLY the built static bundle on an internal HTTP port.
# It does NOT do TLS or host-level reverse proxying — that is 001D.
# The frontend calls the backend via same-origin /api/v1/* paths, which the
# pilot reverse proxy (001D) routes to control-api.
server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Healthcheck probe — no static file required.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Version identity for deployment verification.
    location = /build-info.json {
        default_type application/json;
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # Static assets — long cache for hashed filenames.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — any non-file route → index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
