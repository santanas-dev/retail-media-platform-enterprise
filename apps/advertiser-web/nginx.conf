# Advertiser Web — static serve + SPA fallback + healthcheck.
# PILOT-DEPLOYMENT-READINESS-001B (SCOPE B).
#
# Static-only container on an internal HTTP port.  TLS and host-level
# reverse proxying are 001D.  Backend calls use same-origin /api/v1/* paths
# routed by the pilot reverse proxy.
server {
    listen 3001;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location = /build-info.json {
        default_type application/json;
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
