# Retail Media Platform — Pilot Compose (production-like, immutable refs)
#
# PILOT-DEPLOYMENT-READINESS-001B (SCOPE A).
#
# This is a SEPARATE production-like overlay. It does NOT replace or modify
# docker-compose.phase1.yml (dev). Key differences from dev:
#   - no `build:` (images come from the lock manifest, pinned by digest)
#   - no source bind mounts
#   - no `latest` / mutable tags — image refs are ${VARIABLE}, resolved from
#     the lock manifest's repository@sha256:digest (via env or --env-file)
#   - restart: unless-stopped on runtime services
#   - healthchecks on all services
#   - startup ordering via service_healthy / service_completed_successfully
#   - app runtime runs under retail_media_app (NOBYPASSRLS)
#   - migration one-shot uses the owner credential
#   - SEED_DEV_CREDENTIALS and LICENSE_DEV_INGEST_ENABLED disabled
#
# Image references are validated by scripts/deploy/validate-image-lock.py.
# Do NOT set them to mutable tags. Run:
#   docker compose -f infra/compose/docker-compose.pilot.yml --env-file infra/deploy/.env.pilot config

name: rmp-pilot

services:
  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_OWNER_USER}
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_OWNER_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    volumes:
      - nats_jetstream:/data
    healthcheck:
      test: ["CMD-SHELL", "nats server check connection --server nats://localhost:4222"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Migration + seed one-shot (owner credential, separated from runtime)
  # ---------------------------------------------------------------------------
  db-migrate:
    image: ${CONTROL_API_IMAGE}
    environment:
      ENVIRONMENT: ${ENVIRONMENT}
      DATABASE_URL: ${MIGRATION_DATABASE_URL}
      # Dev-credential seeding is explicitly forbidden in pilot.
      SEED_DEV_CREDENTIALS: "false"
      LICENSE_DEV_INGEST_ENABLED: "false"
    command: >
      sh -c "
        set -e;
        echo '=== migrations ===';
        cd apps/control-api && alembic upgrade head;
        echo '=== seed ===';
        cd /app && python apps/control-api/seed.py;
        echo '=== grant app role ===';
        cd /app && python infra/compose/grant-app-role.py;
        echo '=== migrate complete ===';
      "
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ---------------------------------------------------------------------------
  # Application services
  # ---------------------------------------------------------------------------
  control-api:
    image: ${CONTROL_API_IMAGE}
    environment:
      ENVIRONMENT: ${ENVIRONMENT}
      RMP_SERVICE: control-api
      RMP_VERSION: ${RMP_VERSION}
      RMP_GIT_SHA: ${RMP_GIT_SHA}
      RMP_BUILD_TIME: ${RMP_BUILD_TIME}
      RMP_SCHEMA_HEAD: ${RMP_SCHEMA_HEAD}
      CONTROL_API_PORT: "8000"
      JWT_SECRET: ${JWT_SECRET}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS}
      DATABASE_URL: ${DATABASE_URL}
      MINIO_INTERNAL_ENDPOINT: ${MINIO_INTERNAL_ENDPOINT}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      CREATIVE_STORAGE_BUCKET: ${CREATIVE_STORAGE_BUCKET}
      CONTRACT_STORAGE_BUCKET: ${CONTRACT_STORAGE_BUCKET}
      CREATIVE_AUTO_APPROVE_UPLOADS: "false"
      METRICS_AUTH_TOKEN: ${METRICS_AUTH_TOKEN}
      LICENSE_DEV_INGEST_ENABLED: "false"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  device-gateway:
    image: ${DEVICE_GATEWAY_IMAGE}
    environment:
      ENVIRONMENT: ${ENVIRONMENT}
      RMP_SERVICE: device-gateway
      RMP_VERSION: ${RMP_VERSION}
      RMP_GIT_SHA: ${RMP_GIT_SHA}
      RMP_BUILD_TIME: ${RMP_BUILD_TIME}
      DEVICE_GATEWAY_PORT: "8001"
      JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: ${DATABASE_URL}
      MANIFEST_SIGNING_KEY: ${MANIFEST_SIGNING_KEY}
      METRICS_AUTH_TOKEN: ${METRICS_AUTH_TOKEN}
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  orchestrator-worker:
    image: ${ORCHESTRATOR_WORKER_IMAGE}
    environment:
      ENVIRONMENT: ${ENVIRONMENT}
      RMP_SERVICE: orchestrator-worker
      RMP_VERSION: ${RMP_VERSION}
      RMP_GIT_SHA: ${RMP_GIT_SHA}
      RMP_BUILD_TIME: ${RMP_BUILD_TIME}
      ORCHESTRATOR_PORT: "8003"
      JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: ${DATABASE_URL}
      NATS_URL: "nats://nats:4222"
      CAMPAIGN_CONSUMER_ENABLED: "true"
      NATS_AUTO_PROVISION: "true"
      MANIFEST_SIGNING_KEY: ${MANIFEST_SIGNING_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8003/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Frontend static containers (001B SCOPE B) — internal HTTP only, TLS = 001D
  # ---------------------------------------------------------------------------
  admin-web:
    image: ${ADMIN_WEB_IMAGE}
    ports:
      - "3000:3000"
    depends_on:
      control-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  advertiser-web:
    image: ${ADVERTISER_WEB_IMAGE}
    ports:
      - "3001:3001"
    depends_on:
      control-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3001/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pg_data:
  minio_data:
  nats_jetstream:
