# Retail Media Platform — LOCAL DEV/QA STAND overlay (LOCAL-DEV-STAND-001).
#
# Overlay on top of docker-compose.pilot.yml. It does NOT relax the pilot
# profile: images stay digest-pinned, no build:, no source mounts, no mutable
# tags, dev seeding and dev ingest stay disabled.
#
# What this overlay changes, and only this:
#   - binds the published UI/API ports to an explicit host address
#     (${STAND_BIND_ADDR}) instead of every interface;
#   - keeps device-gateway reachable from the host only (loopback), because the
#     stand is for manual UI/API checking, not for real KSO devices;
#   - publishes the MinIO S3 API (9000) on ${STAND_BIND_ADDR} ONLY, because
#     creative and contract upload uses browser-side presigned URLs: without a
#     browser-reachable object endpoint those uploads cannot work at all.
#
# postgres / redis / nats publish NO host ports in docker-compose.pilot.yml and
# this overlay deliberately adds none. The MinIO Console (9001) is likewise NOT
# published - only the S3 API port the browser actually needs.
#
# THIS IS NOT A PILOT AND NOT PRODUCTION:
#   - data is disposable, there is no backup;
#   - traffic is plain HTTP on a trusted LAN — this is NOT production-safe TLS.
#
# Usage is via scripts/deploy/local_stand.py, which always passes both files.

name: rmp-local-stand

services:
  control-api:
    environment:
      # DEFECT WORKAROUND (LOCAL-DEV-STAND-001-FU2), not a relaxation.
      # docker-compose.pilot.yml passes MANIFEST_SIGNING_KEY to device-gateway
      # and orchestrator-worker but NOT to control-api. With ENVIRONMENT=dev
      # (what scripts/ci/verify-pilot-run.sh uses) the production validator is
      # skipped, so CI never noticed. With ENVIRONMENT=staging/production
      # control-api refuses to boot:
      #   ValueError: MANIFEST_SIGNING_KEY must be set in production/staging
      # The stand runs as staging, so it supplies the variable here. The proper
      # fix belongs in the pilot compose and needs an owner decision.
      MANIFEST_SIGNING_KEY: ${MANIFEST_SIGNING_KEY}
      # LOCAL-STAND-COOKIE-001: this stand is plain HTTP on a private LAN, where
      # the browser drops a Secure cookie and the session cannot survive a
      # reload. control-api fails closed unless ENVIRONMENT=staging,
      # LOCAL_STAND_MODE=true, SEED_DEV_CREDENTIALS=false and every CORS origin
      # is an http:// loopback/RFC1918 address. HttpOnly and SameSite are
      # unchanged; the pilot profile and production defaults keep Secure=true.
      LOCAL_STAND_MODE: "true"
      REFRESH_TOKEN_COOKIE_SECURE: "false"
    # !override REPLACES the pilot list instead of merging with it. Without it
    # Compose CONCATENATES both lists, so the service gets the pilot's 0.0.0.0
    # mapping AND this one: the second bind fails with "address already in use",
    # and the 0.0.0.0 mapping would expose the stand on every interface rather
    # than the intended address. Observed on the real host (FU4).
    ports: !override
      - "${STAND_BIND_ADDR}:8000:8000"

  device-gateway:
    environment:
      # DEFECT WORKAROUND (FU3), same class as the control-api one above:
      # docker-compose.pilot.yml passes CORS_ALLOWED_ORIGINS to control-api but
      # NOT to device-gateway. Under ENVIRONMENT=staging/production the shared
      # validator refuses to boot:
      #   ValueError: CORS_ALLOWED_ORIGINS must be set to an explicit list in production
      # Observed on the real host: device-gateway sat in a restart loop.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    # Host-only: not exposed to the LAN. Manual checks reach it from the host.
    ports: !override
      - "127.0.0.1:8001:8001"

  admin-web:
    # DEFECT WORKAROUND (FU5): the pilot healthcheck probes localhost, which
    # /etc/hosts maps to BOTH 127.0.0.1 and ::1. wget tries IPv6 first and nginx
    # listens on IPv4 only, so the probe gets "connection refused" while the site
    # serves fine from the LAN. Observed on the real host: both frontends sat
    # unhealthy while curl returned "ok". Pinning to 127.0.0.1 removes it.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Not published directly any more: stand-proxy fronts it so that
    # same-origin /api/v1/* reaches control-api (see stand-proxy below).
    ports: !override []

  advertiser-web:
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3001/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports: !override []

  minio:
    # S3 API only. The browser performs presigned PUT/GET against this address,
    # so MINIO_PUBLIC_ENDPOINT must resolve to it. Console (9001) stays unpublished.
    ports:
      - "${STAND_BIND_ADDR}:9000:9000"

  # ---------------------------------------------------------------------------
  # Reverse proxy (LOCAL-DEV-STAND-001-FU6)
  #
  # The frontend images serve the SPA only. Their own nginx config says so:
  #   "It does NOT do TLS or host-level reverse proxying - that is 001D.
  #    The frontend calls the backend via same-origin /api/v1/* paths, which the
  #    pilot reverse proxy (001D) routes to control-api."
  #
  # That reverse proxy does not exist yet - 001D stopped at host preflight and
  # TLS termination is still owner input. Without it the SPA's /api/v1/* calls
  # are answered by its OWN nginx with index.html, so login silently never
  # reaches control-api. Observed on the stand: zero POST /api/v1/auth/* in the
  # control-api log while the browser got HTTP 200 + HTML.
  #
  # This is the stand's own component, not a change to the pilot profile, and it
  # is plain HTTP on a trusted LAN - explicitly NOT production-safe TLS.
  # ---------------------------------------------------------------------------
  stand-proxy:
    # Pinned by digest: the stand must not silently change proxy build.
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    depends_on:
      control-api:
        condition: service_healthy
      admin-web:
        condition: service_healthy
      advertiser-web:
        condition: service_healthy
    environment:
      NGINX_CONF: |
        # Docker's embedded DNS with a short TTL, and upstreams addressed
        # through variables: nginx resolves a literal proxy_pass name ONCE at
        # startup, so after `local_stand update` recreates the app containers
        # their new IPs were never picked up and every request returned 502.
        resolver 127.0.0.11 valid=10s ipv6=off;
        server {
          listen 3000;
          location = /proxy-health { return 200 "ok\n"; }
          set $$api http://control-api:8000;
          set $$adminweb http://admin-web:3000;
          location /api/ { proxy_pass $$api$$request_uri;
            proxy_set_header Host $$host;
            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $$scheme;
            client_max_body_size 64m; }
          location / { proxy_pass $$adminweb;
            proxy_set_header Host $$host; }
        }
        server {
          listen 3001;
          set $$api2 http://control-api:8000;
          set $$advweb http://advertiser-web:3001;
          location /api/ { proxy_pass $$api2$$request_uri;
            proxy_set_header Host $$host;
            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $$scheme;
            client_max_body_size 64m; }
          location / { proxy_pass $$advweb;
            proxy_set_header Host $$host; }
        }
    command: >
      sh -c "printf '%s' \"$$NGINX_CONF\" > /etc/nginx/conf.d/default.conf &&
             nginx -t && exec nginx -g 'daemon off;'"
    ports:
      - "${STAND_BIND_ADDR}:3000:3000"
      - "${STAND_BIND_ADDR}:3001:3001"
    healthcheck:
      # Probes the proxy itself, not an upstream: a failing app must show up as
      # that app being unhealthy, not as the proxy disappearing.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/proxy-health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
