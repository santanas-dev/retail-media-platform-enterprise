- id: REQ-SEC-001
  title: Identity and MFA
  source:
  - TZ v2.5 §4
  - TZ v2.5 §14
  - tz-v2.6-draft draft-2026-08-28-r422 §25
  normative: MUST
  statement: >-
    AD/LDAP или корпоративный SSO; для internal staff production-протокол и TLS-профиль фиксируются (ADR-006: LDAPS,
    plain LDAP запрещён), advertiser users имеют отдельный local lifecycle (invite/register, bcrypt, reset без user
    enumeration), local account разрешён только как admin break-glass (≤2, вручную заведён, не через API); MFA обязательно
    для системных администраторов, согласующих и любого пользователя с permission публикации или emergency, с session
    policy; **user** access JWT — 15 min, rotating **user** refresh — 8 h в HttpOnly Secure SameSite cookie, access
    token не хранится в local/session storage и токены не попадают в URL; logout/admin revoke инвалидируют сессию;
    login/reset rate limits и correlation ID обязательны; shared accounts запрещены, все действия привязаны к пользователю
    и отдельное право требуется для изменения approved campaigns
