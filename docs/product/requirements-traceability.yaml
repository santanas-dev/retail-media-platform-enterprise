  statement: >-
    advertiser record includes legal entity, brand, contacts and responsible persons; до брони создаётся versioned
    commercial proposal/quote с составом placement, inventory forecast, tariff/discount/package/bonus/compensation
    и сроком действия; каждая campaign обязана иметь ровно одного advertiser organization и `advertiser_contract_id
    NOT NULL` (brand optional), а каждый flight `start_at/end_at` должен находиться внутри `advertiser_contract.valid_from/valid_until`
    (если договор бессрочный — только нижняя граница); API отклоняет нарушение до submit/reservation; campaign stores
    advertiser/brand/order/contract basis, период/goal/limits/budget-or-volume/responsible/status и payment/confirmation
    status, если этот контур входит в scope; placement хранит frequency/constraints; изменения периода, географии,
    креатива или объёма создают новую immutable placement version с audit и diff; замена креатива в live campaign
    требует новой версии и повторного approval; versioned lifecycle and audit
