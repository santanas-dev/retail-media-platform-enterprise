- id: REQ-LIC-001
  title: Licensing и seat ledger
  source:
  - TZ v2.5 §2
  - TZ v2.5 §10
  - TZ v2.5 §15
  - TZ v2.5 §16
  - TZ v2.5 §22
  - tz-v2.6-draft draft-2026-08-28-r422 §25
  normative: MUST
  statement: >-
    License contour отделён от advertiser billing: versioned license grant принадлежит отдельному licensee, имеет
    signed payload/validity/revocation и seat capacity; active device identity атомарно резервирует один seat при
    enrollment, decommission освобождает его, renewal/grant replacement не отключает действующие устройства и переносит
    seats атомарно; превышение лимита и отсутствующий/отозванный/истёкший grant fail-closed для нового enrollment
    с машиночитаемой причиной и audit; Layer 2 signed `.lic`/JWS/CRL и UI upload/view не считаются готовыми без
    отдельного proof, а Layer 1 service/report остаётся доступным; license data не смешиваются с advertiser commercial
    entities
  scope:
  - pilot
  - production
  coverage_type: business
  owner: TBD
  implementation_owner: Claude Code
  roadmap_ids:
  - RM-TECH-206
  - RM-TECH-208
  requirement_status: approved
  delivery_status: planned
  status_changed_at: '2026-08-28T00:00:00Z'
  status_actor: OD-017 (owner ACCEPT r421); A1 bootstrap Claude Code
  dependencies: []
  story_ids:
  - US-LIC-001
  journey_ids:
  - license.enforce
  - license.report
  - license.seat_release
  - license.upload
  - license.view
  pending_journey_ids: []
  scenario_ids: []
  artifacts: []
  acceptance:
  - given: 'US-LIC-001: valid signed grant; `/login`'
    when: >-
      Happy-path: 7 шагов — Licensing → grant/scope → signature/validity → seat impact → confirm → apply → report
    then: >-
      journey завершён; negative path — invalid signature/seat overflow/rollback loss → fail closed; `license.grant_applied`
  evidence: []
  disposition: task
