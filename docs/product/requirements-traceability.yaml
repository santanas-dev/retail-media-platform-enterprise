  statement: >-
    RLS и object authorization применяются на уровнях retailer/network → branch → cluster → store → channel/device/surface
    и advertiser; scope вычисляется из authenticated principal/session, а не из неиспользуемого или подменяемого
    параметра; scope наследуется только вниз по разрешённой иерархии, несколько явно назначенных scope объединяются
    как union разрешённых областей (никогда не intersection и не implicit global), scoped role не расширяется отсутствием
    scope; cross-tenant/cross-retailer доступ запрещён, каждый deny/allow проверяется negative/positive matrix и
    immutable audit; frontend route guards используют те же backend permission-коды и scope; фоновые workers, не
    проходящие HTTP middleware, обязаны перед каждой транзакцией установить явный worker RLS context (system-scoped
    только для документированного service identity либо job-derived scope), используя runtime role без `BYPASSRLS`/superuser
