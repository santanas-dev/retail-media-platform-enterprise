- id: REQ-BIZ-001
  title: Placement/inventory calculation
  source:
  - TZ v2.5 §3
  - TZ v2.5 §6
  - TZ v2.5 §12
  - TZ v2.5 §22
  - tz-v2.6-draft draft-2026-08-28-r422 §25
  normative: MUST
  statement: >-
    capacity/reserved/sold/free рассчитываются и показываются по network/branch/cluster/store/device/logical carrier/surface;
    forecast показов/контактов — по периоду, времени, географии и channel/surface; бизнес-статусы inventory: `free`,
    `reserved`, `sold`, `internal`, `emergency/fallback`. Runtime projection обязан явно mapping-ить фактические
    slot states (`available`, `limited`, `sold_out`, `blocked`) в бизнес-статусы и не выдавать projection за persisted
    enum; правила в админке задают max ad load, slot duration, prime-time, priorities и filler; единицы зависят
    от канала: KSO/TV — эфирное время/слоты, price checker — idle-показы, ESL — статичное размещение/шаблон, LED
    — цикл баннера; conflict включает расписание, долю рекламного времени, priority и campaign limits; reservation/commit
    выполняются атомарно с проверкой актуальной capacity и version/lock, конкурентные запросы не могут продать или
    зарезервировать один и тот же слот дважды; overbooking запрещён по умолчанию и возможен только после owner-approved
    policy; sold-out предлагает альтернативные магазины/периоды/слоты; пример placement: 500 магазинов, 08:00–12:00,
    10 секунд, priority 50
  scope:
