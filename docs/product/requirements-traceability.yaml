- id: REQ-ORCH-004
  title: Transactional outbox integrity
  source:
  - TZ v2.5 §8
  - TZ v2.5 §23
  - TZ v2.5 §24
  - tz-v2.6-draft draft-2026-08-28-r422 §25
  normative: MUST
  statement: >-
    domain write и outbox event в одной PostgreSQL-транзакции; relay атомарно claim-ит `pending` через lease/status
    `publishing`, публикует через NATS JetStream с `Nats-Msg-Id=event_id`, переводит `pending→published` только
    после broker ack, повторяет transient failure ограниченное число попыток (7), после чего переводит в `dead_letter`
    с operator action; события сохраняют `partition_key` и порядок внутри partition, глобальный порядок не обещается;
    replay безопасен и идемпотентен, published retention/cleanup и DLQ retention задаются policy; payload не содержит
    secrets, tokens или PII
  scope:
  - pilot
  - production
  coverage_type: technical
  owner: TBD
  implementation_owner: Claude Code
  roadmap_ids: []
  requirement_status: approved
  delivery_status: planned
  status_changed_at: '2026-08-28T00:00:00Z'
  status_actor: OD-017 (owner ACCEPT r421); A1 bootstrap Claude Code
