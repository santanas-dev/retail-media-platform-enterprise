- id: REQ-OPS-001
  title: Device health/commands
  source:
  - TZ v2.5 §4
  - TZ v2.5 §9
  - TZ v2.5 §10
  - TZ v2.5 §13
  - TZ v2.5 §22
  - tz-v2.6-draft draft-2026-08-28-r422 §25
  normative: MUST
  statement: >-
    status thresholds и per-device health view с last heartbeat, current manifest, player/Chromium version, free
    disk, cache size, recent errors, last successful playback и recent PoP; device-раздел фильтруется по типу носителя,
    версии player/adapter, магазину, зоне, статусу, current manifest и ошибкам применения; система формирует списки
    полностью выпавших магазинов и устройств, влияющих на активные кампании, и передаёт их в forecast/underdelivery;
    runtime health statuses строго соответствуют коду: `unregistered`, `online`, `degraded`, `offline`, `error`,
    `maintenance`, `revoked`; `pending` и `registered` — отдельные enrollment stages/projection, не значения `DeviceStatus`;
    до завершённого enrollment (`unregistered/pending`) delivery/commands запрещены, `maintenance` исключает объект
    из SLA и показов, `revoked` блокирует команды/доставку; command enum `restart_player`, `clear_cache`, `refresh_manifest`,
    `set_maintenance`, `disable_playback`, `revoke_credential`, `sync_gateway`, `inspect_applied_state`, `diagnostics`;
    bulk safeguards, scope/confirmation/audit
  scope:
  - pilot
  - production
  coverage_type: operational
