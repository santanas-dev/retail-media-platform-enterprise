- id: REQ-SEC-003
  title: Device/vendor security
  source:
  - TZ v2.5 §4
  - TZ v2.5 §14
  - tz-v2.6-draft draft-2026-08-28-r422 §25
  normative: MUST
  statement: >-
    ADR-003 lifecycle обязателен: одноразовый `device_code` + `hardware_fingerprint` + `device_type` для enrollment;
    server-side выдача opaque `device_id` и device secret/optional certificate после проверки proof-of-possession;
    если сертификат включён, его профиль явно выбирается из поддержанных `rsa/ed25519/hsm`, с owner-approved capability/rotation/revoke
    policy; credentials хранятся на устройстве зашифрованно; session establishment — HMAC(secret, nonce) с server-side
    nonce replay cache; short-lived **device** JWT (15 min) передаётся только в `Authorization: Bearer`, rotating
    **device** refresh token (24 h) — только в выделенном защищённом поле протокола, оба никогда не попадают в URL;
    revoke немедленно инвалидирует secret/refresh token, active JWT истекают ≤15 min; rotation атомарна с audit;
    повторное использование кода, неверный fingerprint, replay nonce, просроченный/отозванный credential и cross-device
    manifest должны fail-closed; mTLS-ready adapter допускается, полная PKI/CRL/OCSP и proxy enforcement — только
    отдельный production-hardening decision
  scope:
  - pilot
  - production
  coverage_type: security
  owner: TBD
  implementation_owner: Claude Code
  roadmap_ids:
