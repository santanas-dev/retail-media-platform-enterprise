- id: REQ-CHAN-003
  title: Полное управление носителями
  source:
  - TZ v2.5 §2
  - TZ v2.5 §10
  - TZ v2.5 §15
  - TZ v2.5 §23
  - tz-v2.6-draft draft-2026-08-28-r422 §25
  normative: MUST
  statement: >-
    Admin/Operations должны видеть и управлять всеми physical device, logical carrier и display surface всех активных
    каналов через единый scope-aware API/UI: поиск/фильтры, health/status, manifest/version, rollout, диагностика
    и bulk-команды; каждая массовая операция имеет idempotency key, preview затронутых объектов, progress и отдельные
    completed/failed/pending результаты по carrier/surface, partial failure не скрывается, а действие на одном объекте
    не меняет соседние без явной связи; операции подчиняются permission/RLS/confirmation/audit и не вмешиваются
    в checkout, price-verification или критичный store workflow
