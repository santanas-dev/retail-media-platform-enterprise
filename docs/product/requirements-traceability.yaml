    when: 'приходят heartbeat: валидный, повторный, с чужим store_id, с просроченным timestamp'
    then: >-
      валидный обновляет freshness; повтор дедуплицирован; чужой scope отклонён; просроченный не продлевает SLA
      и не маскирует offline
