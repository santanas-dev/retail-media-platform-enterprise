- id: REQ-OPS-009
  title: Device heartbeat contract
  source:
  - TZ v2.5 §10
  - TZ v2.5 §17
  - TZ v2.5 §22
  - tz-v2.6-draft draft-2026-08-28-r422 §25
  normative: MUST
  statement: >-
    Каждый runtime/device отправляет authenticated heartbeat с `device_id`, `store_id`, `channel_type`, `timestamp_utc`,
    local timezone, runtime/player/adapter/manifest versions, health state, cache/free-disk и monotonic sequence;
    сервер дедуплицирует/проверяет scope и clock drift, вычисляет freshness/online→degraded→offline thresholds по
    channel profile, сохраняет последний валидный heartbeat и audit/metric correlation, а просроченный или подделанный
    heartbeat не продлевает SLA и не маскирует offline; canonical payload/version и negative tests обязательны для
    `POST /api/v1/device/heartbeat`, legacy alias допускается только с одинаковой семантикой и deprecation
  scope:
  - pilot
  - production
  coverage_type: operational
  owner: TBD
  implementation_owner: Claude Code
