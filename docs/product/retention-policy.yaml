rules:
- delivery-relevant objects удаляются логически; физическое удаление — после retention и проверки legal/contract constraints
- 'PII: классификация на колонку (RM-TECH-253), lawful purpose, минимизация, residency'
- export только по scope/permission с audit и лимитами периода/объёма
