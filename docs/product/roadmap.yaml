- id: OD-002
  statement: Ed25519 обязателен для device pilot/production. HMAC допустим только для dev и control-plane stand.
  status: approved
  decided_on: '2026-08-26'
- id: OD-003
  statement: Retailer scope — первоклассная граница; bypass только system_admin и security_admin.
  status: approved
  decided_on: '2026-08-26'
- id: OD-004
  statement: UI-smoke отделён от ordinary pytest и является blocking gate для develop, release и повышения journey
    до reachable.
  status: approved
  decided_on: '2026-08-26'
- id: OD-005
  statement: self.campaign_create исключён из ближайшего control-plane pilot; первый pilot managed-first.
  status: approved
  decided_on: '2026-08-26'
- id: OD-006
  statement: При renewal занятые seats старого grant атомарно закрываются и продолжаются под новым grant.
  status: approved
  decided_on: '2026-08-26'
- id: OD-007
  statement: Активный baseline — .81 / stand-27dc397; .77 называется только unreachable at check time.
  status: approved
  decided_on: '2026-08-26'
- id: OD-008
  statement: MFA обязателен до production; согласование NATS с ИТ/ops — до pilot deployment.
  status: open
- id: OD-009
  statement: Объём безопасности и соответствия до production — SIEM/Wazuh-экспорт, минимизация
    PII, доступ администратора только через VPN, retention и партиционирование данных.
    Вопрос - расширяется ли scope RM-OPS-001 этими четырьмя пунктами или каждый становится
    отдельной задачей. Ни один сейчас не назван ни одной из 42 задач.
  status: open
  blocks:
  - RM-OPS-001
- id: OD-010
  statement: Безопасная выкатка — staged rollout с rollback и feature flags. Вопрос - это
    предусловие пилота или production. От ответа зависит, входят ли они в RM-PILOT-002
    preflight или только в RM-OPS-001.
  status: open
  blocks:
  - RM-PILOT-002
  - RM-OPS-001
- id: OD-011
  statement: Нагрузочные профили и критерии производительности на 40K устройств. Вопрос -
    измеряется ли это до пилота как вход в SLO (RM-TECH-205) и в триггер ClickHouse
    (RM-TECH-209), или откладывается до production.
  status: open
  blocks:
  - RM-TECH-205
  - RM-TECH-209
- id: OD-012
  statement: Часовые пояса, календарь и праздничное расписание показов. Это корректность
    доставки, а не операционный вопрос - вопрос владельцу - входит ли в scope пилота.
  status: open
- id: OD-013
  statement: Self-service онбординг рекламодателя - сброс пароля самим пользователем и
    приглашения. Админский сброс и приглашение уже reachable с зелёными смоуками;
    self-service отсутствует. Вопрос согласуется с OD-005 (managed-first) - нужен ли
    self-service в первом пилоте.
  status: open
  blocks:
  - RM-BIZ-002
- id: OD-014
  statement: A/B lift и attribution - материал ветки v2.6, зависит от модели арендатора
    (ADR-018). Вопрос - фиксируется ли как отложенное решением, по образцу ADR-019 для
    Channel Orchestrator, или остаётся неопределённым.
  status: open
- id: OD-015
  statement: Операционный центр здоровья устройств. Функция device.health_view reachable и
    закреплена в CI; вопрос - достаточно ли этого представления для пилота или требуется
    отдельный операционный центр как самостоятельный объём работ.
  status: open
- id: OD-016
  statement: 192.168.110.77 выводится из эксплуатации решением владельца 2026-08-26.
    Уточняет OD-007 в части .77 - формулировка «unreachable at check time» была
    наблюдением до решения; теперь диспозиция decommissioned. Часть OD-007 про активный
    baseline .81/stand-27dc397 остаётся в силе без изменений.
  status: approved
  decided_on: '2026-08-26'
  blocks:
  - RM-ENV-001
