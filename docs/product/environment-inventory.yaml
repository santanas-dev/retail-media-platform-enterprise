# Инвентарь окружений — RM-ENV-001
#
# Назначение: назвать каждое окружение, его идентичность и то, что наблюдение
# в нём ДОКАЗЫВАЕТ, а что нет. Окружение является доказательством только тогда,
# когда наблюдение можно привязать к конкретному коммиту и схеме.
#
# Правится вручную. Проверяется модулем `env` гейта
# scripts/ci/roadmap-governance-guard.py: структура, обязательные поля и правило
# «evidence: true требует pinned identity». Живость здесь НЕ проверяется — CI не
# имеет доступа к этой LAN, и молчаливо зелёная проверка живости была бы ложью.
#
# Формат `identity` совпадает с $defs/environment_identity в roadmap.schema.json.

schema_version: 1
checked_at: '2026-08-31'
checked_by: Claude Code
check_method: |
  curl -s -o /dev/null -w '%{http_code}' --max-time 4 <url> для достижимости;
  GET /version для идентичности; readlink /proc/<pid>/cwd и ps -o lstart= для
  того, из какого дерева и с какого момента работает процесс.
  Loopback-эндпоинты хоста стенда (127.0.0.1:*) с santa2 не наблюдаемы —
  для них фиксируется только `не наблюдался с santa2`, никогда не «200».

environments:

  - id: stand-81
    disposition: active
    role: stand
    title: rmp-local-stand — DEV/QA-стенд владельца, единственный контур, дающий доказательства
    host: 192.168.110.81
    endpoints:
      admin_web: http://192.168.110.81:3000
      advertiser_web: http://192.168.110.81:3001
      control_api: http://192.168.110.81:8000
      minio_s3: http://192.168.110.81:9000
      device_gateway: http://127.0.0.1:8001   # loopback хоста стенда; снаружи не публикуется
    reachable_at_check: true
    observed_at: '2026-08-31T10:52:45Z'
    observed:
      http_admin_web: 200
      http_advertiser_web: 200
      http_control_api_version: 200
      http_control_api_health: 404   # маршрута /health нет; идентичность и живость — GET /version
      http_minio_health_live: 200
      http_device_gateway_from_santa2: 000   # loopback — не наблюдался с santa2, проверяется только на хосте
    identity:
      name: rmp-local-stand
      git_sha: 27dc39707c5c56cdfdcc4250d5aa875d3789c8dc
      bundle: stand-27dc397
      schema_head: '036'
    identity_source: GET /version — сервис сам сообщает version, git_sha, schema_head, environment
    declared_environment: staging
    evidence: true
    evidence_scope: |
      Наблюдение здесь привязывается к коммиту 27dc397 и схеме 036, потому что
      сервис сообщает их сам. Это активный baseline по OD-007. Повторно
      наблюдено 2026-08-31: /version отдаёт ту же identity (build 2026-08-26T09:11:27Z,
      environment staging); relative develop @ 4ac3ddb стенд отстаёт на 18 коммитов,
      ни один не трогает apps/ (governance/docs) — UI стенда актуален для walkthrough.
      device-gateway 127.0.0.1:8001 с santa2 не наблюдался — его живость этим
      инвентарём не утверждается.
    notes: |
      Совпадение проверено: base.stand_baseline в docs/product/roadmap.yaml
      объявляет ровно этот bundle, git_sha и schema_head.

  - id: preview-77
    disposition: decommissioned
    role: retired-preview
    title: Старый LAN preview S-026
    host: 192.168.110.77
    endpoints:
      admin_web: http://192.168.110.77:3000
      advertiser_web: http://192.168.110.77:3001
      control_api: http://192.168.110.77:8000
      device_gateway: http://192.168.110.77:8001
    reachable_at_check: false
    observed:
      http_admin_web: 000
      http_advertiser_web: 000
      http_control_api_version: 000
    identity: null
    identity_source: недоступен — идентичность не наблюдалась
    evidence: false
    evidence_scope: |
      Ничего не доказывает и доказывать не будет. Наблюдение 2026-08-26: HTTP 000
      на :3000, :3001 и :8000. Диспозиция `decommissioned` стоит здесь потому, что
      её принял владелец (OD-016), а не потому, что хост не ответил.
    owner_decision: OD-016
    owner_decision_on: '2026-08-26'
    owner_decision_text: |
      Владелец вывел 192.168.110.77 из эксплуатации 2026-08-26. До этого решения
      здесь стояло только наблюдение `unreachable-at-check-time`: недостижимость
      на момент проверки агент установить может, вывод из эксплуатации — нет.
    related_artifacts:
      - infra/compose/docker-compose.preview.yml   # LAN-оверрайд под этот хост
      - docs/runbook/local-preview.md              # runbook S-026, помечен наблюдением

  - id: santa2-dev
    disposition: active
    role: portal-contour
    title: Локальный preview-контур santa2 (ветка develop) — НЕ DEV-стенд
    host: santa2 (192.168.110.78 / localhost)
    endpoints:
      admin_web: http://192.168.110.78:3100
      advertiser_web: http://192.168.110.78:3101
      control_api: http://192.168.110.78:8010
    reachable_at_check: true
    observed_at: '2026-08-31T10:52:45Z'
    observed:
      http_admin_web: 200
      http_advertiser_web: 200
      http_control_api_version: 200
    identity: null
    identity_source: |
      Отсутствует. Портал — Vite dev-сервер (`vite --host 0.0.0.0 --port 3100`)
      из клона /home/santa2/contours/dev, HEAD 4ac3ddb (develop, refresh-dev.sh
      2026-08-31 по разрешению владельца). control-api — контейнер
      rmp-dev-control-api-1 на :8010; GET /version отдаёт version=dev,
      git_sha=unknown, schema_head=null — идентичность не сообщается.
    evidence: false
    evidence_scope: |
      Не доказательство. Это локальный preview для наблюдения за развитием
      продукта на santa2, а не стенд владельца (stand-81):
      1. API не сообщает идентичность: GET /version отдаёт
         version=dev, git_sha=unknown, schema_head=null — наблюдение нельзя
         привязать к коммиту силами самого сервиса.
      2. Портал — Vite dev-сервер с HMR, не production-сборка.
      3. Контур пересобирается скриптом refresh-dev.sh из клона, который
         движется вместе с develop; операторский walkthrough (Rule 8) и любые
         evidence снимаются только на stand-81. Документы 2026-08-31, называвшие
         этот контур «DEV», исправлены.
    notes: |
      Портал собирается dev-сервером с HMR, а не production-сборкой.

  - id: santa2-prod
    disposition: active
    role: portal-contour
    title: Локальный preview-контур santa2 (ветка main), именуется PROD — НЕ стенд и не production
    host: santa2 (192.168.110.78 / localhost)
    endpoints:
      admin_web: http://192.168.110.78:3000   # не путать с admin_web стенда 192.168.110.81:3000
    reachable_at_check: true
    observed:
      http_admin_web: 200
    identity: null
    identity_source: |
      Отсутствует. Портал — Vite dev-сервер (`vite --host 0.0.0.0 --port 3000`)
      из клона /home/santa2/contours/prod, HEAD b5dd3b3 (main).
      Обслуживающий control-api идентичность не сообщает.
    evidence: false
    evidence_scope: |
      Не доказательство, по тем же трём причинам, что и santa2-dev: общий API
      с DEV, отсутствие идентичности у API и работа API из изменяемого рабочего
      клона. Дополнительно: несмотря на имя PROD, портал поднят Vite dev-сервером,
      то есть это не production-сборка.

  - id: santa2-roadmap-board
    disposition: active
    role: monitoring
    title: Внешний read-only мониторинг — доска roadmap на santa2
    host: santa2 (192.168.110.78)
    endpoints:
      board: http://192.168.110.78:3200
    reachable_at_check: true
    observed_at: '2026-08-31T10:52:45Z'
    observed:
      http_board: 200   # <title>Дорожная карта RMP</title>
    identity: null
    identity_source: |
      Не применимо: не сервис продукта. Доска читает docs/product/roadmap.yaml и
      feature-registry.yaml из локального клона и показывает их; в репозиторий,
      статусы и решения не пишет (границы read-only наблюдателя — DEC-014/OD-027,
      решение владельца ещё open).
    evidence: false
    evidence_scope: |
      Ничего не доказывает о продукте и о контурах. Единственное назначение —
      внешний read-only мониторинг очереди работ. Не является DEV-стендом и не
      используется для walkthrough, smoke или evidence.

  - id: github-actions
    disposition: active
    role: ci
    title: GitHub Actions — Phase 1 Quality Gates
    reachable_at_check: true
    identity_source: |
      Каждый прогон привязан к SHA коммита; идентичность даёт сам GitHub.
    evidence: true
    evidence_scope: |
      Доказывает поведение на конкретном SHA в чистом окружении раннера.
      Не доказывает ничего о том, что развёрнуто на любом из контуров выше.
    last_green_run:
      id: '33000750265'
      git_sha: 47be5dd
      conclusion: success
      jobs: 41
      failures: 0
